# Local stack mirroring Railway: Postgres + PostgREST + S3-compatible storage.
#   docker compose up -d && npm run db:seed && npm run dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54322:5432"]
    volumes: [pakz-db:/var/lib/postgresql/data]

  postgrest:
    image: postgrest/postgrest:v16.5
    depends_on: [db]
    environment:
      PGRST_DB_URI: postgres://authenticator:local-authenticator-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-dev-jwt-secret-at-least-32-characters
      PGRST_SERVER_PORT: "3000"
    ports: ["54321:3000"]

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: pakz-local
      RUSTFS_SECRET_KEY: pakz-local-secret
    ports: ["54323:9000"]
    volumes: [pakz-storage:/data]

volumes:
  pakz-db:
  pakz-storage:
